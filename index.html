<style>
:root{--bg:#f3f6f5;--card:#fff;--tx:#17211e;--mu:#6b7a76;--br:#e3e9e7;--ac:#2f7d68;--ac2:#e8f2ef;--ok:#16a34a;--bad:#dc2626;--or:#f08a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1514;--card:#182120;--tx:#eaf1ef;--mu:#93a39e;--br:#27332f;--ac:#4cb89b;--ac2:#1d2e2a;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1514;--card:#182120;--tx:#eaf1ef;--mu:#93a39e;--br:#27332f;--ac:#4cb89b;--ac2:#1d2e2a;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:150px}
main{max-width:560px;margin:0 auto;padding:10px 12px}
.card{background:var(--card);border:1px solid var(--br);border-radius:18px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#14214d,#2b3a9a);color:#fff;border:0}.hero .mu{color:#c5cbee}
h2{font-size:16px;margin:0 0 8px}h1{font-size:20px;margin:0}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.w{width:100%;margin-top:12px}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--br);border-radius:12px;padding:11px;width:100%}
button{cursor:pointer;width:auto}button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
.mu{color:var(--mu);font-size:13px}.big{font-size:26px;font-weight:700}.ok{color:var(--ok)}.bad{color:var(--bad)}
.bar{height:8px;background:var(--br);border-radius:6px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--ac)}
.it{padding:10px 0;border-top:1px solid var(--br)}.it:first-of-type{border-top:0}
.ic{width:38px;height:38px;border-radius:12px;background:var(--ac2);display:grid;place-items:center;flex:none;font-size:18px}
.rg{width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--br) 0);display:grid;place-items:center;margin:0 auto}
.rg b{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:18px;font-weight:400}
.cg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{border-radius:20px;padding:8px 12px;background:var(--card)}.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:8px;overflow:auto}.seg button{border:0;background:none;padding:7px 12px;border-radius:10px;color:var(--mu);white-space:nowrap}.seg button.on{background:var(--ac);color:#fff}
.mb{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.x2{padding:6px 12px;border-radius:10px}
.x{border:0;background:none;color:var(--bad);padding:4px 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--br);display:flex;align-items:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;padding:8px 2px;color:var(--mu);font-size:12px}nav button.on{color:var(--ac);font-weight:700}
nav .fab{flex:none;width:54px;height:54px;border-radius:50%;background:var(--or);color:#fff;font-size:28px;padding:0;margin:-24px 6px 0}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}.sh.on{display:flex}
.si{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.si input{margin-top:6px}.lb{margin-top:12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.dr{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:320px;background:var(--card);z-index:15;transform:translateX(-105%);transition:transform .2s;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 14px;overflow:auto}.dr.open{transform:none}
.dr button{display:flex;gap:10px;width:100%;border:0;background:none;padding:12px 8px;text-align:left;border-radius:12px}.dr button.on{background:var(--ac2);color:var(--ac);font-weight:700}
#bk{position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.4);display:none}#bk.on{display:block}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:20px;z-index:30;display:none}
.av{width:42px;height:42px;border-radius:12px;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-weight:700;flex:none}
#ts button{width:auto;background:none;border:0;color:#7dd3fc;font-weight:700;padding:0 0 0 8px}
#bkb{position:fixed;left:8px;right:8px;bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:544px;margin:0 auto;z-index:12;display:none;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--ac);border-radius:14px;padding:8px 12px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:14px}
</style></head><body>
<main><div class="top"><button class="x2" onclick="dr(1)">☰</button><h1 id="pt"></h1><button class="x2" onclick="xl()">⬇ Excel</button></div><div id="v"></div></main>
<div id="bk" onclick="dr(0)"></div><div class="dr" id="dr"></div>
<nav id="nv"></nav><div class="sh" id="sh"></div><div id="ts"></div><div id="bkb"><span>💾 Changes not backed up</span><span class="row"><button class="p x2" onclick="bk()">Back up now</button><button class="x" onclick="BH=true;bkBar()">✕</button></span></div>
<script>
const DC=[["Food","🍽️"],["Groceries","🛒"],["Shopping","🛍️"],["Transport","🚌"],["Bills","⚡"],["Entertainment","🎬"],["Healthcare","🩺"],["Fuel","⛽"],["Rent","🏠"],["EMI","💳"],["Other","⋯"]];
const TC=["Work","Personal","Home","Shopping","Health","Finance","Family","Learning","Fitness"],ST=["PPF","FD","Stocks","Mutual Fund","Gold","Cash","Other"];
let S={name:"",cur:"₹",theme:"auto",tx:[],inc:[],save:[],lb:[],tasks:[],budgets:{},cats:[],bills:[],goals:[],offers:[],acc:[],xfer:[],cards:[],tpl:[],osave:[],assets:[],paid:{},lastBackup:"",cloud:false,cdis:false,ts:0,dirty:false,nps:{monthly:0,contribs:[],vals:[],c:{}},fund:{months:6,time:12,saved:0},emis:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem("expmgr")||"{}"))}catch(e){}
let CL=null,CS="",ct=0;const CK=120000;
const hasD=o=>!!o&&(["tx","save","inc","bills","lb","tasks","goals","offers","assets","cards","xfer","tpl","osave"].some(k=>o[k]&&o[k].length)||Object.keys(o.budgets||{}).length>0||!!o.name);
const hasData=()=>hasD(S);
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open("routinee",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const idbSet=async v=>{try{const d=await idb();d.transaction("kv","readwrite").objectStore("kv").put(v,"S")}catch(e){}};
const idbGet=async()=>{try{const d=await idb();return await new Promise(res=>{const q=d.transaction("kv").objectStore("kv").get("S");q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}};
const cloudInit=async()=>{if(CL)return CL;try{if(typeof claude==="undefined")return null;const u=await claude.use("user"),d=await claude.use("db");if(!u||!d)return null;const id=await u.id();if(!id)return null;return CL=d.collection("data/users/"+id)}catch(e){return null}};
async function cloudSave(){if(!S.cloud)return;const c=await cloudInit();if(!c){CS="unavailable";return}try{const j=JSON.stringify(S),n=Math.ceil(j.length/CK)||1;for(let i=0;i<n;i++)await c.doc("c"+i).set({d:j.slice(i*CK,(i+1)*CK)});await c.doc("meta").set({n,ts:S.ts||Date.now(),at:new Date().toISOString()});CS="ok · saved "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}catch(e){CS="error"}}
async function cloudLoad(){const c=await cloudInit();if(!c)return null;try{const m=await c.doc("meta").get();if(!m.exists)return null;let j="";for(let i=0;i<m.data.n;i++){const d=await c.doc("c"+i).get();if(!d.exists)return null;j+=d.data.d}return JSON.parse(j)}catch(e){return null}}
const persist=()=>{idbSet(JSON.stringify(S));clearTimeout(ct);ct=setTimeout(cloudSave,2500)};
const flush=()=>{clearTimeout(ct);idbSet(JSON.stringify(S));cloudSave()};
let BH=false;
const bkBar=()=>{const e=document.getElementById("bkb");if(e)e.style.display=S.dirty&&!BH?"flex":"none"};
const sv=q=>{S.ts=Date.now();if(!q){S.dirty=true;BH=false}try{localStorage.setItem("expmgr",JSON.stringify(S))}catch(e){}persist();bkBar()};
let PC=null;
function apply(o){Object.assign(S,o);if(!S.acc||!S.acc.length)S.acc=defAcc();S.dirty=false;sv(true);thm();render()}
const usePC=()=>{if(PC)apply(PC);PC=null;cl();toast("Data restored")};
async function boot(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{const empty=!hasData();let best=null;const consider=(o,src)=>{if(o&&hasD(o)&&(!best||(o.ts||0)>(best.o.ts||0)))best={o,src}};
let ib=null;try{const raw=await idbGet();ib=raw?JSON.parse(raw):null}catch(e){}consider(ib,"device");
if(S.cloud||empty)consider(await cloudLoad(),"cloud");
if(!best)return;
if(empty){apply(best.o);toast("Recovered your data from the "+best.src+" copy")}
else if((best.o.ts||0)>(S.ts||0)+5000){PC=best.o;sheet("Newer copy found",`<div>A newer copy of your data was found in your ${best.src} storage (${new Date(best.o.ts).toLocaleString()}).</div><button class="p w" onclick="usePC()">Use newer copy</button><button class="w" onclick="PC=null;cl()">Keep this device’s data</button>`)}}catch(e){}}
async function cloudOn(){const c=await cloudInit();if(!c)return toast("Cloud copy isn’t available in this view. Open the page from claude.ai while signed in.");S.cloud=true;sv();await cloudSave();render();toast(CS.startsWith("ok")?"Cloud copy is on":"Couldn’t save to cloud")}
const syncNow=async()=>{await cloudSave();render();toast(CS.startsWith("ok")?"Saved to cloud":"Couldn’t save to cloud")};
async function cloudOff(){const c=await cloudInit();try{if(c){const m=await c.doc("meta").get(),n=m.exists?m.data.n:1;for(let i=0;i<n;i++)await c.doc("c"+i).delete();await c.doc("meta").delete()}}catch(e){}S.cloud=false;sv();render();toast("Cloud copy deleted")}
const defAcc=()=>[{id:"acc_cash",name:"Cash",type:"cash",open:0},{id:"acc_bank",name:"Bank",type:"bank",open:0},{id:"acc_wallet",name:"Wallet",type:"wallet",open:0}];if(!S.acc||!S.acc.length)S.acc=defAcc();
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const ld=d=>{const z=new Date(d);return z.getFullYear()+"-"+pad(z.getMonth()+1)+"-"+pad(z.getDate())},today=()=>ld(new Date());
let M=today().slice(0,7),pg="home",TR="1D",SR="1M",AT="Insights",LT="People",LF="All",TF="Pending",F={},LST={},rst=0;
const shift=(m,d)=>{const[y,o]=m.split("-").map(Number),z=new Date(y,o-1+d,1);return z.getFullYear()+"-"+pad(z.getMonth()+1)};
const ml=m=>new Date(m+"-01T00:00").toLocaleString("en",{month:"long",year:"numeric"}),dim=m=>{const[y,o]=m.split("-").map(Number);return new Date(y,o,0).getDate()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>S.cur+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2}),k=n=>S.cur+(Math.abs(n)>=1000?(n/1000).toFixed(1).replace(/\.0$/,"")+"k":Math.round(n));
const catList=()=>DC.map(x=>x[0]).concat(S.cats),icon=c=>(DC.find(x=>x[0]===c)||[0,"🏷️"])[1];
const ord=d=>d+["th","st","nd","rd"][(d%100>10&&d%100<14)?0:(d%10<4?d%10:0)];
const sum=a=>a.reduce((s,x)=>s+x.amt,0),exps=m=>S.tx.filter(t=>t.type==="out"&&t.date.startsWith(m));
const incTot=m=>sum(S.inc.filter(i=>(i.from||"0")<=m))+sum(S.tx.filter(t=>t.type==="in"&&t.date.startsWith(m)));
const savM=m=>sum(S.save.filter(s=>s.date.startsWith(m)));
const byCat=m=>{const o={};exps(m).forEach(t=>o[t.cat]=(o[t.cat]||0)+t.amt);return o};
let UF=null,TT=0,EID="";
const toast=(m,u)=>{const t=$("ts");t.innerHTML=esc(m)+(u?' <button onclick="doUndo()">Undo</button>':"");UF=u||null;t.style.display="block";clearTimeout(TT);TT=setTimeout(()=>t.style.display="none",u?7000:2200)};
const doUndo=()=>{if(UF)UF();UF=null;$("ts").style.display="none"};
const rm=(k,id)=>{const a=S[k].slice();S[k]=S[k].filter(x=>x.id!==id);sv();render();toast("Deleted",()=>{S[k]=a;sv();render()})};
function daysToPay(){const t=new Date(),t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());let b=0;
S.inc.forEach(i=>{let n=new Date(t.getFullYear(),t.getMonth(),i.day);if(n<=t0)n=new Date(t.getFullYear(),t.getMonth()+1,i.day);const d=Math.round((n-t0)/864e5);if(!b||d<b)b=d});
return b||(dim(today().slice(0,7))-t.getDate()+1)}
const spark=v=>{if(v.length<2)v=[0].concat(v,v.length?[]:[0]);const w=300,h=70,m=Math.max(1,...v),p=v.map((y,i)=>[i/(v.length-1)*w,h-4-(y/m)*(h-12)]),d=p.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join("");
return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:80px"><path d="${d}L${w} ${h}L0 ${h}Z" fill="var(--ac)" opacity=".13"/><path d="${d}" fill="none" stroke="var(--ac)" stroke-width="2.5"/></svg>`};
const seg=(l,cur,fn)=>`<div class="seg">${l.map(x=>`<button class="${x===cur?"on":""}" onclick="${fn}('${x}')">${x}</button>`).join("")}</div>`;
