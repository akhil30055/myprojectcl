const lkHash=async(pin,salt)=>{try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pin));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of salt+pin)h=(h*33+c.charCodeAt(0))|0;return"d"+h}};

async function lkKey(k_){const c=lkGet();if(!c)return;if(k_==="⌫")LKP=LKP.slice(0,-1);else if(LKP.length<c.len)LKP+=k_;lkDraw();if(LKP.length===c.len){const h=await lkHash(LKP,c.salt);if(h===c.hash){LKP="";$("lk").style.display="none"}else{LKP="";lkDraw("Wrong PIN, try again")}}}

function lkErase(){try{localStorage.removeItem("expmgr");localStorage.removeItem(LK);indexedDB.deleteDatabase("routinee")}catch(e){}location.reload()}
function lockCard(){const c=lkGet();return `<div class="card"><h2>🔒 App lock</h2><div class="mu">Hides your data behind a PIN when the app opens. It locks the screen on this device only; backup and Excel files aren’t encrypted.</div>${c?`<div class="it row sp"><span>Lock after leaving the app</span><select style="width:auto" onchange="lkAfter(this.value)">${[[0,"Immediately"],[60,"1 minute"],[300,"5 minutes"]].map(([a,l])=>`<option value="${a}" ${c.after===a?"selected":""}>${l}</option>`).join("")}</select></div><button class="w" onclick="lkSetup()">Change PIN</button><button class="w bad" onclick="lkRemove()">Remove PIN</button>`:`<button class="p w" onclick="lkSetup()">Set a PIN</button>`}</div>`}
const lkAfter=x=>{const c=lkGet();if(c){c.after=+x;localStorage.setItem(LK,JSON.stringify(c))}};
function lkSetup(){const c=lkGet();sheet(c?"Change PIN":"Set a PIN",`${c?`<input id="po" type="password" inputmode="numeric" maxlength="6" placeholder="Current PIN">`:""}<input id="pa" type="password" inputmode="numeric" maxlength="6" placeholder="New PIN (4–6 digits)"><input id="pb" type="password" inputmode="numeric" maxlength="6" placeholder="Repeat new PIN"><button class="p w" onclick="lkSave()">Save PIN</button>`)}
async function lkSave(){const c=lkGet(),a=v("pa"),b=v("pb");if(c&&(await lkHash(v("po"),c.salt))!==c.hash)return toast("Current PIN is wrong");if(!/^\d{4,6}$/.test(a))return toast("Use 4 to 6 digits");if(a!==b)return toast("PINs don’t match");const salt=Math.random().toString(36).slice(2);localStorage.setItem(LK,JSON.stringify({salt,hash:await lkHash(a,salt),len:a.length,after:c?c.after:60}));cl();render();toast("PIN saved")}
function lkRemove(){sheet("Remove PIN",`<input id="po" type="password" inputmode="numeric" maxlength="6" placeholder="Enter your PIN"><button class="p w" onclick="lkDoRemove()">Remove PIN</button>`)}
async function lkDoRemove(){const c=lkGet();if(!c||(await lkHash(v("po"),c.salt))!==c.hash)return toast("Wrong PIN");localStorage.removeItem(LK);cl();render();toast("PIN removed")}
/* ---------- shell ---------- */
const payList=()=>["Cash","Card","UPI","Bank","Wallet"].concat(S.cards.length?["Credit Card"]:[]);
function accSel(t){const e=$("ac");if(!e)return;
if(F.pay==="Credit Card"&&S.cards.length){const l=S.cards.map(c=>c.name),c0=t&&t.card&&S.cards.find(c=>c.id===t.card);e.innerHTML=`<div class="lb">Credit card</div>`+chips("cd",l,c0?c0.name:l[0])}
else{const l=S.acc.map(a=>a.name),a0=t&&t.acc&&S.acc.find(a=>a.id===t.acc)||S.acc.find(a=>a.id===accOf({pay:F.pay}))||S.acc[0];e.innerHTML=`<div class="lb">Account</div>`+chips("ac_",l,a0.name)}}
function addExp(){const l=catList();sheet("Add expense",`${S.tpl.length?`<div class="lb">⚡ Quick add</div><div class="cg">${S.tpl.map(t=>`<button class="chip" onclick="useTpl('${t.id}')">${icon(t.cat)} ${esc(t.name)} · ${k(t.amt)}</button>`).join("")}</div>`:""}<input id="am" type="number" inputmode="decimal" placeholder="Amount" style="font-size:24px"><div class="lb row sp">Category <button class="x2" onclick="newCat()">+ New</button></div>${chips("cat",l)}<div class="lb">Date</div><input id="dt" type="date" value="${today()}"><div class="lb">Paid by</div>${chips("pay",payList(),"UPI")}<div id="ac"></div><input id="nt" placeholder="Note (optional)" style="margin-top:10px"><div id="of"></div><button class="p w" onclick="saveExp()">Save expense</button><button class="w" onclick="saveTpl()">☆ Save as quick-add template</button>`);accSel();showOffers()}
const txFrom=()=>{const a=num("am");if(!(a>0)){toast("Enter an amount");return null}const o={amt:a,cat:F.cat,pay:F.pay,date:v("dt")||today(),note:v("nt").trim()};if(F.pay==="Credit Card"){const c=S.cards.find(x=>x.name===F.cd);if(c)o.card=c.id}else{const c=S.acc.find(x=>x.name===F.ac_);if(c)o.acc=c.id}return o};
function saveExp(){const o=txFrom();if(!o)return;S.tx.push(Object.assign({id:uid(),type:"out"},o));M=o.date.slice(0,7);done("Expense saved")}
function saveTpl(){const o=txFrom();if(!o)return;S.tpl.push({id:uid(),name:o.note||o.cat,amt:o.amt,cat:o.cat,pay:o.pay,acc:o.acc,card:o.card,note:o.note});sv();toast("Template saved")}
function useTpl(id){const t=S.tpl.find(x=>x.id===id);if(!t)return;const n=uid(),o={id:n,type:"out",amt:t.amt,cat:t.cat,pay:t.pay,date:today(),note:t.note||""};if(t.acc)o.acc=t.acc;if(t.card&&S.cards.some(c=>c.id===t.card))o.card=t.card;S.tx.push(o);sv();cl();render();toast("Added "+t.name,()=>{S.tx=S.tx.filter(x=>x.id!==n);sv();render()})}
function editTx(id){const t=S.tx.find(x=>x.id===id);if(!t)return;const inc=t.type==="in",cl_=inc?["Bonus","Gift","Refund","Other"]:catList(),pl=payList();if(!cl_.includes(t.cat))cl_.push(t.cat);if(t.pay&&!pl.includes(t.pay))pl.push(t.pay);EID=id;
sheet(inc?"Edit income":"Edit expense",`<input id="am" type="number" inputmode="decimal" value="${t.amt}" style="font-size:24px"><div class="lb">Category</div>${chips("cat",cl_,t.cat)}<div class="lb">Date</div><input id="dt" type="date" value="${t.date}">${inc?"":`<div class="lb">Paid by</div>${chips("pay",pl,t.pay||"UPI")}`}<div id="ac"></div><input id="nt" value="${esc(t.note||"")}" placeholder="Note" style="margin-top:10px"><button class="p w" onclick="saveEdit()">Save changes</button><button class="w bad" onclick="cl();delTx('${id}')">Delete</button>`);if(inc)F.pay="";accSel(t)}
function saveEdit(){const t=S.tx.find(x=>x.id===EID);if(!t)return;const a=num("am");if(!(a>0))return toast("Enter an amount");t.amt=a;t.cat=F.cat;t.date=v("dt")||t.date;t.note=v("nt").trim();
if(t.type==="out"){t.pay=F.pay;delete t.acc;delete t.card;if(F.pay==="Credit Card"){const c=S.cards.find(x=>x.name===F.cd);if(c)t.card=c.id}else{const c=S.acc.find(x=>x.name===F.ac_);if(c)t.acc=c.id}}else{const c=S.acc.find(x=>x.name===F.ac_);if(c)t.acc=c.id}done("Updated")}
/* ---- accounts, cards, purchases ---- */
const an=id=>!id?"Outside":(S.acc.find(a=>a.id===id)||S.cards.find(c=>c.id===id)||{name:"?"}).name;
const typ=a=>a.type||(a.id==="acc_cash"?"cash":a.id==="acc_wallet"?"wallet":"bank");
const bankId=()=>{if(S.defBank&&S.acc.some(a=>a.id===S.defBank))return S.defBank;const b=S.acc.find(a=>typ(a)==="bank");return b?b.id:S.acc[0].id};
const accOf=t=>{if(t.pay==="Credit Card")return null;if(t.acc&&S.acc.some(a=>a.id===t.acc))return t.acc;const d=({Cash:"acc_cash",Wallet:"acc_wallet"})[t.pay];return d&&S.acc.some(a=>a.id===d)?d:bankId()};
const incAcc=i=>S.acc.some(a=>a.id===i.acc)?i.acc:bankId();
const incCount=i=>{const cm=today().slice(0,7),td=new Date().getDate();let n=0;for(let m=i.from||cm;m<=cm;m=shift(m,1))if(m<cm||i.day<=td)n++;return n};
const flow=id=>{let b=0;S.tx.forEach(t=>{if(accOf(t)===id)b+=t.type==="in"?t.amt:-t.amt});S.inc.forEach(i=>{if(incAcc(i)===id)b+=i.amt*incCount(i)});S.xfer.forEach(x=>{if(x.to===id)b+=x.amt;if(x.from===id)b-=x.amt});return b};
const bal=id=>(S.acc.find(a=>a.id===id).open||0)+flow(id);
const cout=c=>(c.open||0)+sum(S.tx.filter(t=>t.card===c.id&&t.type==="out"))-sum(S.xfer.filter(x=>x.to===c.id));
function cinfo(c){const t=new Date(),t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());let ls=new Date(t.getFullYear(),t.getMonth(),c.bill);if(ls>t0)ls=new Date(t.getFullYear(),t.getMonth()-1,c.bill);let due=new Date(ls.getFullYear(),ls.getMonth(),c.due);if(c.due<=c.bill)due=new Date(ls.getFullYear(),ls.getMonth()+1,c.due);const lsd=ld(ls),un=sum(S.tx.filter(x=>x.card===c.id&&x.type==="out"&&x.date>lsd)),o=cout(c);const ps=sum(S.xfer.filter(x=>x.to===c.id&&x.date>lsd)),bl=Math.max(0,o-un);return{ls:lsd,due:ld(due),dd:Math.round((due-t0)/864e5),un,billed:bl,paidSince:ps,stmt:bl+ps,o}}
function accounts(){const tot=S.acc.reduce((s,a)=>s+bal(a.id),0),by=t=>S.acc.filter(a=>typ(a)===t),sm=l=>l.reduce((s,a)=>s+bal(a.id),0),
row=a=>`<div class="card row sp" onclick="editAcc('${a.id}')" style="cursor:pointer"><div class="row"><div class="ic">${typ(a)==="cash"?"💵":typ(a)==="wallet"?"👛":"🏦"}</div><div>${esc(a.name)}${a.id===bankId()&&by("bank").length>1?' <span class="mu">· default</span>':""}<div class="mu">${a.last4?"•••• "+esc(a.last4)+" · ":""}Tap to edit</div></div></div><b class="${bal(a.id)<0?"bad":""}">${money(bal(a.id))}</b></div>`;
return `<div class="card hero"><div class="row sp"><div><div class="mu">TOTAL BALANCE</div><div class="big">${money(tot)}</div></div><button class="p x2" onclick="addXfer()">⇄ Transfer</button></div><div class="mu" style="margin-top:6px">Banks ${money(sm(by("bank")))} · Cash ${money(sm(by("cash")))} · Wallet ${money(sm(by("wallet")))}</div></div>
<div class="row sp"><h2>Bank accounts</h2><button class="x2" onclick="addAcc()">+ Add bank</button></div>${by("bank").map(row).join("")||'<div class="card mu">No bank accounts yet. Tap + Add bank.</div>'}
<h2>Cash &amp; wallet</h2>${by("cash").concat(by("wallet")).map(row).join("")}
<div class="row sp"><h2>Credit cards</h2><button class="x2" onclick="addCard()">+ Card</button></div>
${S.cards.map(c=>{const i=cinfo(c),u=c.limit?Math.min(100,i.o/c.limit*100):0;return `<div class="card"><div class="row sp"><b>💳 ${esc(c.name)}${c.last4?` <span class="mu">•••• ${esc(c.last4)}</span>`:""}</b><span><button class="x2" onclick="editCard('${c.id}')">Edit</button><button class="x" onclick="rm('cards','${c.id}')">✕</button></span></div><div class="g2" style="margin-top:8px"><div><div class="mu">Outstanding</div><b class="${i.o>0?"bad":"ok"}">${money(i.o)}</b></div><div><div class="mu">Due ${i.due}</div><b class="${i.billed<=0&&i.stmt>0?"ok":i.billed>0&&i.dd<=3?"bad":""}">${i.billed<=0?(i.stmt>0?"✓ Paid":"No bill due"):i.dd<0?"overdue":i.dd===0?"today":"in "+i.dd+" days"}</b></div></div><div class="mu" style="margin-top:6px">Bill ${money(i.stmt)} · paid ${money(i.paidSince)} · remaining ${money(i.billed)} · new since ${i.ls}: ${money(i.un)}</div>${i.billed>0?`<button class="p w" onclick="payCard('${c.id}')">Mark as paid · ${money(i.billed)}</button>`:""}${c.limit?`<div class="bar"><i style="width:${u}%;${u>70?"background:var(--bad)":""}"></i></div><div class="mu">${Math.round(u)}% of ${money(c.limit)} limit used</div>`:""}</div>`}).join("")||'<div class="card mu">Add a credit card to track its billing cycle, due date and outstanding amount. Then choose “Credit Card” when adding an expense.</div>'}
<h2>Transfers &amp; card payments</h2><div class="card">${S.xfer.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(x=>`<div class="it row sp"><div>${esc(an(x.from))} → ${esc(an(x.to))}<div class="mu">${x.date}${x.note?" · "+esc(x.note):""}</div></div><div class="row"><b>${money(x.amt)}</b><button class="x" onclick="rm('xfer','${x.id}')">✕</button></div></div>`).join("")||'<div class="mu">None yet.</div>'}</div><div class="mu">Balances = opening balance + income − expenses ± transfers. Savings entries and lent/borrowed money don’t change balances.</div>`}
const addAcc=()=>sheet("New bank account",`<input id="an" placeholder="Bank name (e.g. HDFC Savings)"><input id="al" placeholder="Last 4 digits of account no. (optional)" maxlength="4"><input id="ao" type="number" inputmode="decimal" placeholder="Current balance"><button class="p w" onclick="saveAcc()">Save bank</button>`);
const nameUsed=n=>S.acc.some(a=>a.name.toLowerCase()===n.toLowerCase())||S.cards.some(c=>c.name.toLowerCase()===n.toLowerCase());
function saveAcc(){const n=v("an").trim();if(!n)return toast("Enter the bank name");if(nameUsed(n))return toast("That name is already used");S.acc.push({id:uid(),name:n,type:"bank",last4:v("al").trim(),open:parseFloat(v("ao"))||0});done("Bank added")}
function editAcc(id){const a=S.acc.find(x=>x.id===id),nb=S.acc.filter(x=>typ(x)==="bank").length,canDel=typ(a)==="bank"?nb>1:!(id==="acc_cash"||id==="acc_wallet");EID=id;
sheet("Edit "+esc(a.name),`<input id="an" value="${esc(a.name)}"><input id="al" value="${esc(a.last4||"")}" placeholder="Last 4 digits of account no. (optional)" maxlength="4"><div class="lb">Actual balance right now</div><input id="ao" type="number" inputmode="decimal" placeholder="${bal(id)}"><div class="mu" style="margin-top:6px">Enter what your bank or wallet really shows; the app adjusts the opening balance to match.</div><button class="p w" onclick="saveEditAcc()">Save</button>${typ(a)==="bank"&&id!==bankId()?`<button class="w" onclick="S.defBank='${id}';sv();cl();render();toast('Default bank set')">Use as default for UPI / Card / Bank payments</button>`:""}${canDel?`<button class="w bad" onclick="cl();rm('acc','${id}')">Delete account</button><div class="mu">Entries linked to it move to your default bank.</div>`:""}`)}
function saveEditAcc(){const a=S.acc.find(x=>x.id===EID),n=v("an").trim(),x=parseFloat(v("ao"));if(n&&n!==a.name){if(nameUsed(n)&&n.toLowerCase()!==a.name.toLowerCase())return toast("That name is already used");a.name=n}a.last4=v("al").trim();if(!isNaN(x))a.open=x-flow(a.id);done("Account updated")}
function addXfer(){const a=S.acc.map(x=>x.name),b=a.concat(S.cards.map(c=>"💳 "+c.name));sheet("Transfer money",`<div class="lb">From</div>${chips("xf",a,a[0])}<div class="lb">To</div>${chips("xt",b,b[1]||b[0])}<input id="xa" type="number" inputmode="decimal" placeholder="Amount"><input id="dt" type="date" value="${today()}"><input id="nt" placeholder="Note (optional)"><button class="p w" onclick="saveXfer()">Transfer</button>`)}
const idOf=n=>{const a=S.acc.find(x=>x.name===n);if(a)return a.id;const c=S.cards.find(x=>"💳 "+x.name===n);return c?c.id:""};
function saveXfer(){const a=num("xa"),f=idOf(F.xf),t=idOf(F.xt);if(!(a>0))return toast("Enter an amount");if(!f||!t||f===t)return toast("Pick two different places");S.xfer.push({id:uid(),from:f,to:t,amt:a,date:v("dt")||today(),note:v("nt").trim()});done("Transferred")}
const addCard=()=>sheet("New credit card",`<input id="cn" placeholder="Card name (e.g. HDFC Regalia)"><input id="cx" placeholder="Last 4 digits (optional)" maxlength="4"><input id="cl" type="number" inputmode="decimal" placeholder="Credit limit (optional)"><input id="cb" type="number" min="1" max="31" placeholder="Statement day (1-31)"><input id="cd_" type="number" min="1" max="31" placeholder="Payment due day (1-31)"><input id="co" type="number" inputmode="decimal" placeholder="Current outstanding (optional)"><button class="p w" onclick="saveCard()">Save card</button>`);
function saveCard(){const n=v("cn").trim(),b=parseInt(v("cb")),d=parseInt(v("cd_"));if(!n||!(b>=1&&b<=31)||!(d>=1&&d<=31))return toast("Add name, statement day and due day");S.cards.push({id:uid(),name:n,last4:v("cx").trim(),limit:parseFloat(v("cl"))||0,bill:b,due:d,open:parseFloat(v("co"))||0});done("Card added")}
function payCard(id){const c=S.cards.find(x=>x.id===id),i=cinfo(c),l=S.acc.map(a=>a.name).concat(["Other (not tracked)"]);EID=id;sheet("Mark "+esc(c.name)+" bill as paid",`<div class="mu">Remaining bill ${money(i.billed)} · due ${i.due}</div><div class="lb">Paid from</div>${chips("pf",l,an(bankId()))}<div class="mu" style="margin-top:6px">Pick “Other” if you paid from somewhere the app doesn’t track; your account balances stay unchanged.</div><input id="xa" type="number" inputmode="decimal" value="${Math.round(i.billed)||""}" placeholder="Amount paid"><input id="dt" type="date" value="${today()}"><button class="p w" onclick="savePayCard()">Mark as paid</button>`)}
function savePayCard(){const a=num("xa"),o=F.pf==="Other (not tracked)",f=o?"":idOf(F.pf);if(!(a>0)||(!f&&!o))return toast("Enter an amount");S.xfer.push({id:uid(),from:f,to:EID,amt:a,date:v("dt")||today(),note:"Card bill"});done("Bill marked as paid")}
function editCard(id){const c=S.cards.find(x=>x.id===id);EID=id;sheet("Edit card",`<input id="cn" value="${esc(c.name)}" placeholder="Card name"><input id="cx" value="${esc(c.last4||"")}" placeholder="Last 4 digits (optional)" maxlength="4"><input id="cl" type="number" inputmode="decimal" value="${c.limit||""}" placeholder="Credit limit"><input id="cb" type="number" min="1" max="31" value="${c.bill}" placeholder="Statement day"><input id="cd_" type="number" min="1" max="31" value="${c.due}" placeholder="Payment due day"><div class="lb">Actual outstanding right now</div><input id="co" type="number" inputmode="decimal" placeholder="${Math.round(cout(c))}"><div class="mu" style="margin-top:6px">Enter what your card app shows; the app adjusts its starting figure to match.</div><button class="p w" onclick="saveEditCard()">Save changes</button>`)}
function saveEditCard(){const c=S.cards.find(x=>x.id===EID),n=v("cn").trim(),b=parseInt(v("cb")),d=parseInt(v("cd_")),x=parseFloat(v("co"));if(!n||!(b>=1&&b<=31)||!(d>=1&&d<=31))return toast("Add name, statement day and due day");if(n.toLowerCase()!==c.name.toLowerCase()&&nameUsed(n))return toast("That name is already used");c.name=n;c.last4=v("cx").trim();c.limit=parseFloat(v("cl"))||0;c.bill=b;c.due=d;if(!isNaN(x))c.open=x-(cout(c)-(c.open||0));done("Card updated")}
function big(){return `<div class="card hero"><div class="row sp"><div><div class="mu">COST PER DAY</div><div class="big">${S.assets.length} item${S.assets.length===1?"":"s"}</div><div class="mu">What your big purchases really cost</div></div><button class="p x2" onclick="addAsset()">+</button></div></div>`+(S.assets.map(a=>{const d=Math.max(1,Math.floor((new Date()-new Date(a.date+"T00:00"))/864e5)+1),net=a.price-(a.resale||0),life=(a.years||0)*365,p=life?Math.min(100,d/life*100):0;return `<div class="card"><div class="row sp"><b>${esc(a.name)}</b><button class="x" onclick="rm('assets','${a.id}')">✕</button></div><div class="mu">Bought ${a.date} · ${money(a.price)}${a.resale?" · resale "+money(a.resale):""} · ${d} days</div><div class="big">${money(net/d)}<span class="mu"> / day so far</span></div>${life?`<div class="bar"><i style="width:${p}%"></i></div><div class="mu">${Math.round(p)}% of ${a.years}-year life · drops to ${money(net/life)}/day if used the full time</div>`:""}</div>`}).join("")||'<div class="card mu">Add a phone, laptop or appliance. Seeing the cost per day makes big purchases easier to judge.</div>')}
const addAsset=()=>sheet("Add purchase",`<input id="pn" placeholder="What did you buy? (e.g. iPhone)"><input id="pp" type="number" inputmode="decimal" placeholder="Price"><div class="lb">Purchase date</div><input id="pd" type="date" value="${today()}"><input id="py" type="number" inputmode="decimal" placeholder="Expected years of use (optional)"><input id="pr" type="number" inputmode="decimal" placeholder="Resale / trade-in value (optional)"><button class="p w" onclick="saveAsset()">Save</button>`);
function saveAsset(){const n=v("pn").trim(),p=num("pp");if(!n||!(p>0))return toast("Add name and price");S.assets.push({id:uid(),name:n,price:p,date:v("pd")||today(),years:parseFloat(v("py"))||0,resale:parseFloat(v("pr"))||0});done("Purchase added")}
const addSaved=id=>{const o=S.offers.find(x=>x.id===id);EID=id;sheet("Saved with this offer",`<div class="mu">${esc(o.title)}</div><input id="sa" type="number" inputmode="decimal" placeholder="Amount you saved"><input id="dt" type="date" value="${today()}"><input id="nt" placeholder="Note (optional)"><button class="p w" onclick="saveSaved()">Save</button>`)};
function saveSaved(){const a=num("sa"),o=S.offers.find(x=>x.id===EID);if(!(a>0))return toast("Enter an amount");S.osave.push({id:uid(),oid:EID,title:o?o.title:"",amt:a,date:v("dt")||today(),note:v("nt").trim()});done("Saving logged")}

/* ---------- Purchase Planner: one-time purchases, independent of EMI planner ---------- */
function purchase(){const list=(S.purchases||[]).slice().sort((a,b)=>b.created-a.created),open=list.filter(x=>x.status!=="Bought");return `<div class="card hero"><div class="row sp"><div><div class="mu">SMART SHOPPING DECISIONS</div><div class="big">${open.length} planned</div><div class="mu">Assess affordability before spending a lump sum</div></div><button class="p x2" onclick="addPurchase()">+ Plan</button></div></div>${open.map(x=>purchaseCard(x)).join("")||'<div class="card mu">No planned purchases yet. Add an item to see whether now is a sensible time to buy.</div>'}<div class="card"><h2>Purchase history</h2>${list.filter(x=>x.status==="Bought").map(x=>purchaseCard(x)).join("")||'<div class="mu">Completed purchases will appear here.</div>'}</div>`}
function purchaseCard(x){const a=purchaseAdvice(x);return `<div class="card"><div class="row sp"><div><b>${esc(x.name)}</b><div class="mu">${esc(x.category)} · ${x.urgency} priority · ${x.years||"—"} yr use</div></div><b>${money(x.amount)}</b></div><div class="mu" style="margin:8px 0">${a.title}</div><div class="mu">${a.detail}</div><div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="x2" onclick="editPurchase('${x.id}')">Edit</button>${x.status!=="Bought"?`<button class="x2" onclick="buyPurchase('${x.id}')">Mark bought</button>`:`<span class="mu">Purchased ${x.bought||""}</span>`}<button class="x" onclick="delPurchase('${x.id}')">✕</button></div></div>`}
function purchaseAdvice(x){const m=today().slice(0,7),income=incTot(m),spent=sum(exps(m)),saving=savM(m),cash=Math.max(0,income-spent-saving),emi=(S.emis||[]).reduce((a,e)=>a+(+e.amt||0),0),days=daysToPay(),reserve=Math.max(0,cash/Math.max(1,days)*30),budgetCat=(S.budgets||{})[x.category]||0,spentCat=sum(S.tx.filter(t=>t.type==="out"&&t.cat===x.category&&t.date.startsWith(m))),daily=["Food","Groceries","Transport","Fuel","Bills"].includes(x.category),budgetLeft=Math.max(0,budgetCat-spentCat),balance=(S.acc||[]).reduce((a,b)=>a+(+b.open||0),0),target=+x.amount||0;let title="Save first",detail="Your current month’s remaining cash flow is limited. Avoid using money reserved for bills or essentials.";if(x.urgency==="High"&&cash>=target&&(!daily||budgetLeft>=target)){title="Can consider buying now";detail="It appears manageable against this month’s cash flow. Keep your emergency savings and upcoming bills untouched."}else if(cash>=target*1.25&&(!daily||budgetLeft>=target)){title="Affordable now";detail="Your recent cash flow suggests room for this purchase. Check actual account balances and upcoming commitments before paying."}else if(daily&&budgetLeft<target){title="Wait or adjust the category budget";detail=`Only ${money(budgetLeft)} remains in this month’s ${x.category} budget. This purchase may push it over budget.`}else detail=`Current month income: ${money(income)}; recorded spending: ${money(spent)}; savings contributions: ${money(saving)}; listed monthly EMIs: ${money(emi)}. Consider setting aside ${money(target)} over time.`;if(x.urgency==="Low"&&title==="Affordable now")title="Affordable, but consider waiting";return {title,detail}}
function addPurchase(id){const x=(S.purchases||[]).find(z=>z.id===id)||{};EID=id||"";sheet(id?"Edit purchase":"Plan a purchase",`<input id="pn" placeholder="What do you want to buy?" value="${esc(x.name||"")}"><input id="pa" type="number" inputmode="decimal" placeholder="Expected price" value="${x.amount||""}"><div class="lb">Category</div>${chips("pcat",["Electronics","Gadgets","Clothing","Home","Food","Groceries","Transport","Fuel","Healthcare","Education","Other"],x.category||"Electronics")}<div class="lb">Priority</div>${chips("purg",["High","Medium","Low"],x.urgency||"Medium")}<div class="lb">How long will you use it?</div><input id="py" type="number" min="0" step="0.5" placeholder="Expected years (optional)" value="${x.years||""}"><div class="lb">Need / reason</div><input id="pnote" placeholder="Why do you need it? (optional)" value="${esc(x.note||"")}"><button class="p w" onclick="savePurchase()">Save plan</button>`)}
function editPurchase(id){addPurchase(id)}
function savePurchase(){const name=v("pn").trim(),amount=num("pa");if(!name||!(amount>0))return toast("Enter item name and price");const x={id:EID||uid(),name,amount,category:F.pcat,urgency:F.purg,years:num("py")||0,note:v("pnote").trim(),status:"Planned",created:Date.now()};const old=(S.purchases||[]).findIndex(z=>z.id===EID);if(old>=0){x.status=S.purchases[old].status;x.bought=S.purchases[old].bought;S.purchases[old]=x}else{S.purchases=S.purchases||[];S.purchases.push(x)}done("Purchase plan saved")}
function buyPurchase(id){const x=S.purchases.find(z=>z.id===id);if(x){x.status="Bought";x.bought=today();sv();render();toast("Marked as purchased")}}
function delPurchase(id){S.purchases=S.purchases.filter(x=>x.id!==id);sv();render()}
/* ---------- Nutrition tracker: estimated values per serving, fully editable quantity ---------- */
const NFOOD=[ ["Cooked Kerala rice","1 cup",4.0,205,0.4,0.6], ["Chapati","1 medium",3.0,110,0.4,2.5], ["Idli","2 pieces",4.0,130,0.5,1.0], ["Dosa","1 medium",3.0,130,0.5,1.0], ["Puttu","1 medium serving",4.0,220,1.0,2.0], ["Appam","1 piece",2.0,120,0.5,1.0], ["Boiled egg","1 egg",6.0,78,1.0,0], ["Omelette","1 egg",6.0,100,1.0,0], ["Fish curry","1 serving (100 g fish)",20.0,170,1.0,0], ["Chicken","100 g cooked",27.0,165,1.0,0], ["Milk","250 ml",8.0,150,2.5,0], ["Plain curd / buttermilk","1 glass (200 ml)",6.0,100,2.0,0], ["Kadala / black chana","1 cup cooked",14.0,270,8.0,12], ["Chana","1 cup cooked",14.0,270,8.0,12], ["Soya chunks","25 g dry",13.0,85,4.0,5], ["Dal","1 cup cooked",9.0,180,6.0,8], ["Thoran","1 serving",3.0,100,2.0,4], ["Avial","1 serving",3.0,130,3.0,4], ["Guava","1 medium",2.5,68,228,5.4], ["Banana","1 medium",1.3,105,10,3.1], ["Apple","1 medium",0.5,95,8,4.4], ["Peanuts","30 g",7.5,170,0,2.5] ];
function rtNutrition(){const d=today(),logs=(S.nutrition.logs||[]).filter(x=>x.date===d),p=logs.reduce((a,x)=>a+x.protein,0),cal=logs.reduce((a,x)=>a+x.cal,0),f=logs.reduce((a,x)=>a+x.fiber,0),vit=logs.reduce((a,x)=>a+x.vitc,0),goal=+S.nutrition.goal||Math.max(45,Math.round((((S.rt.weights||[]).slice().sort((a,b)=>b.date.localeCompare(a.date))[0]||{}).kg||60)*0.8)),left=Math.max(0,goal-p);return rdNav()+`<div class="card hero"><div class="mu">TODAY'S NUTRITION · ESTIMATES</div><div class="row sp"><div><div class="big">${p.toFixed(1)} g</div><div class="mu">Protein · target ${goal} g</div></div><div class="rg" style="--p:${Math.min(100,p/goal*100)}"><b>${Math.round(p/goal*100)}%</b></div></div><div class="bar"><i style="width:${Math.min(100,p/goal*100)}%"></i></div><div class="mu" style="margin-top:8px">${left?left.toFixed(1)+" g protein remaining to target":"Protein target reached — nice work"}</div></div><div class="card"><h2>Daily totals</h2><div class="g2"><div><div class="mu">Calories</div><b>${Math.round(cal)} kcal</b></div><div><div class="mu">Fibre</div><b>${f.toFixed(1)} g</b></div><div><div class="mu">Vitamin C</div><b>${Math.round(vit)} mg</b></div><div><div class="mu">Foods logged</div><b>${logs.length}</b></div></div><div class="mu" style="margin-top:8px">${p<goal?"Add a protein-rich item such as egg, fish, curd, dal, kadala or soya to a meal.":"Keep varying your protein sources and include vegetables and fruit."}</div></div><div class="card"><div class="row sp"><h2>Food log</h2><button class="p x2" onclick="addNutrition()">+ Add food</button></div>${logs.map(x=>`<div class="it row sp"><div><b>${esc(x.food)}</b><div class="mu">${x.qty} serving · ${x.cal} kcal · ${x.protein} g protein</div></div><button class="x" onclick="delNutrition('${x.id}')">✕</button></div>`).join("")||'<div class="mu">Log foods you ate today. Values are approximate and depend on recipe and portion size.</div>'}</div><div class="card"><h2>Nutrition target</h2><div class="mu">Set a daily protein target (grams). General adult reference is around 0.8 g/kg/day; individual needs vary with activity and health.</div><input type="number" min="1" max="250" value="${goal}" onchange="S.nutrition.goal=Math.max(1,+this.value||goal);sv();render()"></div>`}
function addNutrition(){sheet("Add food",`<div class="lb">Food / dish</div><select id="nf">${NFOOD.map((x,i)=>`<option value="${i}">${x[0]} · ${x[1]}</option>`).join("")}</select><div class="lb">Number of servings</div><input id="nq" type="number" min="0.25" step="0.25" value="1"><div class="mu" style="margin-top:8px">You can log multiple dishes for the same meal. Nutrition values are estimates.</div><button class="p w" onclick="saveNutrition()">Add to today's log</button>`)}
function saveNutrition(){const x=NFOOD[+$('nf').value],q=+$('nq').value;if(!x||!(q>0))return toast("Choose food and quantity");S.nutrition.logs=S.nutrition.logs||[];S.nutrition.logs.push({id:uid(),date:today(),food:x[0],qty:q,protein:+(x[2]*q).toFixed(1),cal:Math.round(x[3]*q),fiber:+(x[4]*q).toFixed(1),vitc:+(x[5]*q).toFixed(1)});done("Food added")}
function delNutrition(id){S.nutrition.logs=S.nutrition.logs.filter(x=>x.id!==id);sv();render()}

const P={purchase,rt_nutrition:rtNutrition,home,hist,bud,acc:accounts,bills,offers,big:emiPage,nps,inc,sav,lb:lbp,ana,task,rt_body:rtBody,rt_focus:rtFocus,rt_today:rtToday,rt_routines:rtRoutines,rt_habits:rtHabits,rt_food:rtFood,rt_growth:rtGrowth,rt_mood:rtMood,rt_sleep:rtSleep,rt_review:rtReview,set},T={purchase:"Purchase Planner",rt_nutrition:"Nutrition",home:"Home",hist:"History",bud:"Budget",acc:"Accounts & Cards",bills:"Bills",offers:"Offers",big:"EMI planner",nps:"NPS",inc:"Income",sav:"My Savings",lb:"Lent & Borrowed",ana:"Analytics",task:"Tasks",rt_body:"Body & fitness",rt_focus:"Focus timer",rt_today:"Today",rt_routines:"Routines",rt_habits:"Habits",rt_food:"Food & water",rt_growth:"Growth",rt_mood:"Journal & mood",rt_sleep:"Sleep",rt_review:"Weekly review",set:"Settings"};
let MODE="fin",LP="",hiddenAt=0;

const go=p=>{if(DP.includes(p))MODE="day";else if(p!=="task"&&p!=="set")MODE="fin";pg=p;dr(0);render();scrollTo(0,0)};
const setMode=m=>{MODE=m;pg=m==="day"?"rt_today":"home";dr(0);render();scrollTo(0,0)};
const FIN_G=[["Daily money",["home","hist","bud","inc"]],["Accounts",["acc","bills","lb","offers"]],["Plan & grow",["sav","nps","big","purchase","ana"]],["More",["task","set"]]],DAY_G=[["Every day",["rt_today","rt_routines","rt_habits","rt_food","rt_nutrition"]],["Mind & body",["rt_mood","rt_sleep","rt_body","rt_growth"]],["Focus & review",["rt_focus","rt_review"]],["More",["task","set"]]];
const IC={purchase:"🛍️",rt_nutrition:"🥑",home:"🏠",hist:"🕘",bud:"📊",inc:"💵",acc:"🏦",bills:"🧾",lb:"🤝",offers:"🏷️",sav:"🐖",nps:"🏛️",big:"🧮",ana:"📈",task:"✅",set:"⚙️",rt_today:"🌿",rt_routines:"🔁",rt_habits:"🔥",rt_food:"🥗",rt_growth:"🌱",rt_mood:"📓",rt_sleep:"🌙",rt_review:"📋",rt_body:"💪",rt_focus:"⏱️"};
const dailyAdd=()=>sheet("Quick add",`<div class="dg">${[["💧","+1 glass of water","wInc(1);cl();toast('💧 +1 glass')"],["🥗","Log a meal","cl();addMeal()"],["🙂","Mood / journal","cl();go('rt_mood')"],["🔥","New habit","cl();editH()"],["📚","Log learning","cl();addLearn()"],["🎯","New goal","cl();addG()"],["🎯","Today’s priority","cl();addTop()"],["✅","New task","cl();addTask()"],["💪","Log workout","cl();addWorkout()"],["⚖️","Log weight","cl();addWeight()"],["😴","Log sleep","cl();go('rt_sleep')"],["⏱️","Focus timer","cl();go('rt_focus')"]].map(([e,t,f])=>`<button onclick="${f}"><span>${e}</span> ${t}</button>`).join("")}</div>`);
const dr=o=>{$("dr").classList.toggle("open",!!o);$("bk").classList.toggle("on",!!o)};

const nb=a=>a.map(([p,e,n])=>`<button class="${pg===p?"on":""}" onclick="go('${p}')">${e}<br>${n}</button>`).join("");
$("nv").innerHTML=day?nb([["rt_today","🌿","Today"],["rt_habits","🔥","Habits"]])+`<button class="fab" onclick="dailyAdd()">+</button>`+nb([["rt_food","🥗","Food"],["rt_mood","📓","Journal"]]):nb([["home","🏠","Home"],["bud","📊","Budget"]])+`<button class="fab" onclick="addExp()">+</button>`+nb([["hist","🕘","History"],["task","✅","Tasks"]]);
$("dr").innerHTML=`<div class="row" style="margin-bottom:12px"><div class="av">${esc((S.name||"Me")[0].toUpperCase())}</div><b>${esc(S.name||"My Routinee")}</b></div><button class="sw" onclick="setMode('${day?"fin":"day"}')">${day?"💰 Switch to Money":"🌿 Switch to Daily planner"}</button>`+(day?DAY_G:FIN_G).map(([h,l])=>`<div class="lb" style="margin:12px 0 6px">${h}</div><div class="dg">${l.map(p=>`<button class="${pg===p?"on":""}" onclick="go('${p}')"><span>${IC[p]}</span> ${T[p]}</button>`).join("")}</div>`).join("")}
try{document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){hiddenAt=Date.now();flush()}else{const c=lkGet();if(c&&hiddenAt&&Date.now()-hiddenAt>=c.after*1000)lockShow()}});addEventListener("pagehide",flush)}catch(e){}
